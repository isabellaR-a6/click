name: Build iOS (.ipa sem assinatura)

# Runner macOS do GitHub — gratis em repositorio publico.
# O .ipa sai SEM assinatura de proposito: quem assina e o SideStore,
# no iPhone, com Apple ID gratuito.
#
# O log do build vai junto na Release porque log de Actions exige login
# para ler, e Release e download publico.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Versao exata que o Flet 0.86.5 pede. Sem fixar, o 'stable' traz a mais
      # recente e o Flet abre um prompt [y/n] que trava o CI com EOFError.
      - name: Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==0.86.5"

      - name: Ambiente
        run: |
          {
            echo "===== ambiente ====="
            xcodebuild -version
            echo "cocoapods: $(pod --version)"
            flutter --version
            echo "flet: $(flet --version)"
          } 2>&1 | tee -a build.log

      - name: Build iOS
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          # 'yes ""' responde o default a qualquer prompt que o Flet ainda abra
          yes "" | flet build ipa -v --flutter-build-args=--no-codesign 2>&1 | tee -a build.log

      - name: Inventario da saida
        if: always()
        run: |
          {
            echo "===== resultado do flet: ${{ steps.build.outcome }} ====="
            echo "===== arvore build/ ====="
            find build -maxdepth 5 2>/dev/null || echo "(pasta build nao existe)"
            echo "===== .app ====="
            find . ~/Library/Developer/Xcode/DerivedData -name '*.app' -type d 2>/dev/null | head -20
            echo "===== .xcarchive ====="
            find . ~/Library/Developer/Xcode/DerivedData -name '*.xcarchive' -type d 2>/dev/null | head -20
          } 2>&1 | tee -a build.log
          echo "--- ultimas 60 linhas ---"; tail -60 build.log

      - name: Empacotar em .ipa (se houver .app)
        if: always()
        continue-on-error: true
        run: |
          APP="$(find build ~/Library/Developer/Xcode/DerivedData -name '*.app' -type d \
                 -path '*Products/Applications*' 2>/dev/null | head -1)"
          if [ -z "$APP" ]; then
            APP="$(find build -name '*.app' -type d 2>/dev/null | head -1)"
          fi
          if [ -n "$APP" ]; then
            echo "app: $APP" | tee -a build.log
            rm -rf Payload && mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qry click.ipa Payload
            ls -lh click.ipa | tee -a build.log
          else
            echo "nenhum .app gerado — publicando so o log" | tee -a build.log
          fi

      - name: Publicar (.ipa quando existir, log sempre)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "build ${{ github.run_number }}"
          body: |
            .ipa sem assinatura, para instalar pelo SideStore.
            build.log vai junto para diagnostico.
          files: |
            click.ipa
            build.log
          fail_on_unmatched_files: false

      # Fonte do SideStore: com ela o jogo aparece dentro do app com botao
      # "Atualizar", em vez de baixar .ipa na mao a cada build.
      # O commit leva [skip ci] para nao disparar o workflow de novo.
      - name: Gerar source.json
        if: always()
        continue-on-error: true
        env:
          IPA_NAME: click.ipa
          REPO: ${{ github.repository }}
          TAG: build-${{ github.run_number }}
          SOURCE_NOME: "Jogos da Isabella"
          SOURCE_ID: "br.isabellaradael.source.click"
          APP_NOME: "Cabo de Guerra"
          APP_BUNDLE_ID: "br.isabellaradael.click"
          APP_SUBTITULO: "Cabo de guerra numerico para dois"
          APP_DESCRICAO: "Dois jogadores, um celular. Cada lado toca na sua metade da tela para puxar o placar. Quem chegar a 5 primeiro ganha."
          APP_ICONE_URL: "https://raw.githubusercontent.com/isabellaR-a6/click/main/src/assets/icon.png"
        run: |
          python3 tools/gerar_source.py 2>&1 | tee -a build.log || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Atualiza source.json para ${TAG} [skip ci]" || exit 0
          git push
